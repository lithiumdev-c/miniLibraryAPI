services:
  postgres:
    image: postgres:18
    container_name: minilibrary-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: librarypass333
      POSTGRES_DB: library

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: